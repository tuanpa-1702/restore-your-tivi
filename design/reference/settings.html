<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tivi Home · Cài đặt giao diện</title>
  <link rel="stylesheet" href="style.css">
  <script src="stage.js"></script>
</head>
<body>
<!-- Settings: a 640dp column of glass rows (title + value). OK on a row opens its editor. -->
<main class="stage theme-tim-hong">
  <div>
    <div class="page-title">Cài đặt giao diện</div>
    <div class="page-sub">OK để thay đổi · Back để về màn hình chính</div>
  </div>
  <div class="rows">
    <div class="row is-focused"><div class="t">Lời chào</div><div class="v">Xin chào Thỏ Miu!</div></div>
    <div class="row"><div class="t">Vị trí thời tiết</div><div class="v">Hà Nội</div></div>
    <div class="row"><div class="t">Màu nền</div><div class="v">Tím hồng</div></div>
    <div class="row"><div class="t">Ứng dụng trên dock</div><div class="v">YouTube · Cửa hàng · Cài đặt · Ứng dụng</div></div>
    <div class="row"><div class="t">Khoá trẻ em</div><div class="v">Hẹn giờ 15 phút – 2 tiếng hoặc tuỳ chỉnh (đang đặt 45 phút)</div></div>
  </div>
</main>
</body>
</html>
