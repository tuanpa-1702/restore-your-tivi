<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tivi Home · Ứng dụng</title>
  <link rel="stylesheet" href="style.css">
  <script src="icons.js"></script>
  <script src="stage.js"></script>
</head>
<body>
<!-- Apps screen: 6-column grid of glass cards (app banner or icon + name). Focused card: green ring; while moving: amber ring. -->
<main class="stage theme-tim-hong">
  <div>
    <div class="page-title">Ứng dụng</div>
    <div class="page-sub">OK để mở · Giữ OK để di chuyển hoặc thêm vào dock · Back để về màn hình chính</div>
  </div>
  <div class="apps">
    <div class="app is-focused"><div class="art"><span class="glyph" style="background:var(--accent-brand)" data-icon="palette"></span></div><div class="name">Cài đặt giao diện</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#E53935" data-icon="play"></span></div><div class="name">YouTube</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#1E88E5" data-icon="globe"></span></div><div class="name">Trình duyệt</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#43A047" data-icon="store"></span></div><div class="name">Cửa hàng</div></div>
    <div class="app is-moving"><div class="art"><span class="glyph" style="background:#FB8C00" data-icon="music"></span></div><div class="name">Nhạc</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#8E24AA" data-icon="photo"></span></div><div class="name">Ảnh</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#00897B" data-icon="news"></span></div><div class="name">Tin tức</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#546E7A" data-icon="gear"></span></div><div class="name">Cài đặt</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#D81B60" data-icon="play"></span></div><div class="name">Phim</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#3949AB" data-icon="globe"></span></div><div class="name">Thể thao</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#6D4C41" data-icon="photo"></span></div><div class="name">Thư viện</div></div>
    <div class="app"><div class="art"><span class="glyph" style="background:#00ACC1" data-icon="music"></span></div><div class="name">Radio</div></div>
  </div>
</main>
</body>
</html>
